# Development PostgreSQL option. The embedded local database needs no Docker.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurelle
      POSTGRES_USER: aurelle_migrator
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelle_migrator -d aurelle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
